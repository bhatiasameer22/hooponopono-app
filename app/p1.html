<title>Ho'oponopono</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone app shell (max 520px) on a warm ground; stacked screens with a 5-tab bottom bar; full-screen player overlay.
   Deliberately single light identity (cream / sage / blush), with four user themes that swap the tokens. */
:root{
  --ground:#EFE6D8; --cream:#FBF6EE; --ivory:#FFFCF7; --beige:#F3EADD; --line:#ECE2D3;
  --ink:#2D3830; --muted:#636D66; --faint:#8C948D;
  --sage:#557A5D; --sage-ink:#FFFFFF; --sage-soft:#E4EEE2; --botanical:#3F6148;
  --blush:#F9E2E1; --peach:#FCE8D9; --lavender:#EDE6F5; --sky:#E2ECF4; --gold:#C8A25E; --rose:#C2567A;
  --shadow:0 10px 30px -18px rgba(70,55,35,.35), 0 2px 6px -2px rgba(70,55,35,.08);
  --r-lg:24px; --r-md:18px; --r-sm:14px;
  --serif:"Cormorant Garamond", "Playfair Display", Georgia, serif;
  --sans:"Figtree", -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
.app[data-theme="sunset"]{--cream:#FDF3EE;--ivory:#FFFBF8;--beige:#F7E6DD;--line:#F0DDD3;--sage:#A5574D;--sage-soft:#F8E0D8;--botanical:#86463E}
.app[data-theme="lavender"]{--cream:#F9F6FC;--ivory:#FFFDFF;--beige:#EEE8F5;--line:#E6DFEF;--sage:#6A5A99;--sage-soft:#EAE4F5;--botanical:#524380}
.app[data-theme="forest"]{--cream:#F3F6F1;--ivory:#FCFEFB;--beige:#E6EDE3;--line:#DDE6D9;--sage:#3D6A4B;--sage-soft:#DBE8DA;--botanical:#2E5139}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--sage);outline-offset:2px;border-radius:10px}
img{max-width:100%;display:block}
h1,h2,h3,p{margin:0}
.app{position:relative;max-width:520px;min-height:100%;margin:0 auto;background:var(--cream);overflow-x:hidden;transition:background .4s}
@media (min-width:560px){.app{box-shadow:0 0 0 1px var(--line),0 40px 90px -40px rgba(60,45,25,.35)}}
.view{min-height:100vh;padding:0 20px 120px;animation:fadein .45s ease both}
.view.full{padding:0}
.view.nonav{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* type */
.serif{font-family:var(--serif)}
.h-xl{font-family:var(--serif);font-weight:600;font-size:2.35rem;line-height:1.08;letter-spacing:.005em;text-wrap:balance}
.h-lg{font-family:var(--serif);font-weight:600;font-size:1.85rem;line-height:1.12;text-wrap:balance}
.h-md{font-family:var(--serif);font-weight:600;font-size:1.4rem;line-height:1.2}
.h-sm{font-weight:650;font-size:1rem;font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:.86rem} .xs{font-size:.76rem}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* TopHeader */
.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;margin:0 -4px;background:linear-gradient(var(--cream) 75%,transparent)}
.top h1{font-family:var(--serif);font-weight:600;font-size:1.6rem;text-align:center;line-height:1.1}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);transition:transform .15s,background .2s}
.iconbtn:active{transform:scale(.92)}
.iconbtn.soft{background:var(--ivory);box-shadow:var(--shadow)}
.iconbtn svg{width:22px;height:22px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;border:0;font-weight:600;font-size:1rem;transition:transform .15s,box-shadow .2s,background .2s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--sage);color:var(--sage-ink);box-shadow:0 12px 24px -14px var(--sage)}
.btn-secondary{background:var(--ivory);color:var(--ink);border:1.5px solid var(--line)}
.btn-cream{background:#FBF1E2;color:#2D3830;box-shadow:0 14px 30px -12px rgba(0,0,0,.45)}
.btn-block{width:100%}
.btn-sm{min-height:40px;padding:0 16px;font-size:.88rem}
.link{background:none;border:0;color:var(--botanical);font-weight:600;padding:8px 4px}

/* cards */
.card{background:var(--ivory);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 12px}
.section-h h2{font-family:var(--serif);font-weight:600;font-size:1.35rem}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 6px;margin:0 -20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 18px;border-radius:999px;border:1.5px solid transparent;background:var(--beige);font-weight:600;font-size:.9rem;color:var(--ink);transition:background .2s}
.chip[aria-pressed="true"]{background:var(--sage);color:var(--sage-ink)}

/* premium badge */
.pbadge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:linear-gradient(135deg,#F6E7C7,#EBD3A0);color:#6B4E14;font-size:.7rem;font-weight:700;letter-spacing:.02em}
.pbadge svg{width:12px;height:12px}

/* circular play */
.cplay{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--beige);display:grid;place-items:center;color:var(--ink);transition:transform .15s}
.cplay.solid{background:var(--sage);color:var(--sage-ink);width:52px;height:52px;box-shadow:0 10px 20px -10px var(--sage)}
.cplay:active{transform:scale(.92)}
.cplay svg{width:18px;height:18px}

/* meditation card */
.mlist{display:flex;flex-direction:column;gap:12px}
.mcard{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 10px;border-radius:var(--r-md);background:var(--ivory);box-shadow:var(--shadow);border:0;text-align:left;width:100%}
.mcard .thumb{position:relative;width:76px;height:76px;flex:none;border-radius:16px;overflow:hidden;background:var(--beige)}
.mcard .thumb img{width:100%;height:100%;object-fit:cover}
.mcard .thumb .lock{position:absolute;inset:auto 5px 5px auto;width:22px;height:22px;border-radius:50%;background:rgba(255,252,247,.9);display:grid;place-items:center;color:#6B4E14}
.mcard .thumb .lock svg{width:12px;height:12px}
.mcard h3{font-size:1rem;font-weight:600;line-height:1.25}
.mcard .meta{font-size:.84rem;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mbar{height:4px;border-radius:2px;background:var(--beige);margin-top:8px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--sage);border-radius:2px}

/* category card */
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ccard{position:relative;border:0;padding:0;border-radius:20px;overflow:hidden;aspect-ratio:1.32;box-shadow:var(--shadow);background:var(--beige)}
.ccard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.ccard:hover img{transform:scale(1.04)}
.ccard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(20,24,20,.62))}
.ccard span{position:absolute;left:0;right:0;bottom:12px;z-index:1;text-align:center;color:#fff;font-weight:600;font-size:.98rem;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.ccard .pbadge{position:absolute;top:10px;right:10px;z-index:1}
@media (min-width:500px){.cgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* home tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{border:0;border-radius:20px;padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:112px;font-weight:600;font-size:.86rem;line-height:1.2;text-align:center;box-shadow:0 8px 18px -14px rgba(70,55,35,.4);transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile img{width:44px;height:42px;object-fit:contain}

/* toggle */
.tgl{position:relative;flex:none;width:52px;height:32px;border-radius:999px;border:0;background:#DCD2C3;transition:background .25s;padding:0}
.tgl::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .25s}
.tgl[aria-checked="true"]{background:var(--sage)}
.tgl[aria-checked="true"]::after{transform:translateX(20px)}

/* lists */
.list{background:var(--ivory);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:12px 16px;border:0;background:none;text-align:left;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.li .ico svg{width:20px;height:20px}
.chev{width:18px;height:18px;color:var(--faint);flex:none}

/* bottom nav */
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,252,247,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;font-size:.7rem;font-weight:600;color:var(--faint)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--sage)}
.nav button[aria-current="page"] svg{fill:currentColor;fill-opacity:.16}

/* onboarding */
.onb{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.onb .bg{position:absolute;inset:0;background-size:cover;background-position:center top;animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.08) translateY(-1%)}}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:#CFC6B8;transition:all .3s}
.dots i.on{background:var(--sage);width:22px;border-radius:5px}
.skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:3;border:0;background:rgba(255,252,247,.55);backdrop-filter:blur(6px);border-radius:999px;padding:8px 16px;font-weight:600;font-size:.9rem;color:var(--ink)}
.lotus-mark{width:64px;height:48px;margin:0 auto}
.benefit{display:flex;align-items:center;gap:16px}
.benefit img{width:56px;height:56px;flex:none}

/* hero botanical */
.botan{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:150px;display:grid;place-items:center;padding:22px 64px;box-shadow:var(--shadow);background:#EEF1E4}
.botan img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.botan p{position:relative;font-family:var(--serif);font-size:1.3rem;font-weight:600;line-height:1.3;text-align:center;color:#2D3830}

/* today practice */
.today{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-lg);background:linear-gradient(120deg,#FBE9EC 0%,#F2EFE8 55%,#E3EFEE 100%);box-shadow:var(--shadow);border:0;width:100%;text-align:left}
.today img{width:72px;height:72px;border-radius:50%;flex:none}

/* player */
.player{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;background:#0B1512}
.player[hidden]{display:none}
.player .stage{position:relative;width:100%;max-width:520px;height:100%;overflow:hidden;color:#F7F2E8;display:flex;flex-direction:column}
.player .pbg{position:absolute;inset:0 0 auto 0;height:78%;background-size:cover;background-position:center 30%;animation:drift 40s ease-in-out infinite alternate}
.player .pbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,14,.55) 0%,rgba(8,16,14,.05) 30%,rgba(8,16,14,0) 60%,#0B1512 100%)}
.player .glow{position:absolute;left:50%;top:60%;width:260px;height:180px;margin-left:-130px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,196,140,.45),transparent);animation:breathe 6s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:.9;transform:scale(1.08)}}
.player canvas.dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.player .ptop{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0}
.player .iconbtn{color:#F7F2E8}
.player .iconbtn.on{color:#F4A6BE}
.player .ptitle{position:relative;z-index:2;text-align:center;padding:4px 24px 0}
.player .ptitle h2{font-family:var(--serif);font-weight:600;font-size:1.75rem;line-height:1.15;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.player .ptitle p{font-size:.88rem;opacity:.85;margin-top:4px}
.mantra{position:relative;z-index:2;text-align:center;margin-top:22px;padding:0 20px;display:flex;flex-direction:column;gap:2px}
.mantra span{font-family:var(--serif);font-weight:500;font-size:clamp(1.9rem,8.4vw,2.4rem);line-height:1.22;opacity:.62;transition:opacity .8s,text-shadow .8s,transform .8s;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.mantra span.on{opacity:1;text-shadow:0 0 22px rgba(255,214,170,.75),0 2px 12px rgba(0,0,0,.3);transform:scale(1.04)}
.guided{position:relative;z-index:2;margin-top:26px;padding:0 28px;text-align:center;font-family:var(--serif);font-size:clamp(1.6rem,7vw,2.05rem);line-height:1.25;min-height:5.2em;text-shadow:0 2px 14px rgba(0,0,0,.45);transition:opacity .6s}
.pctl{position:relative;z-index:2;margin-top:auto;padding:0 24px calc(18px + env(safe-area-inset-bottom,0px))}
.seek{position:relative;height:28px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.seek .track{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:rgba(255,255,255,.28)}
.seek .fill{position:absolute;left:0;height:4px;border-radius:2px;background:#FBF1E2}
.seek .knob{position:absolute;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(255,220,180,.8)}
.ptimes{display:flex;justify-content:space-between;font-size:.8rem;opacity:.85;font-variant-numeric:tabular-nums}
.pmain{display:flex;align-items:center;justify-content:center;gap:36px;margin:12px 0 18px}
.pbig{width:78px;height:78px;border-radius:50%;border:0;background:#FBF6EE;color:#1E2B25;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(255,255,255,.08),0 12px 30px rgba(0,0,0,.4);transition:transform .15s}
.pbig:active{transform:scale(.94)}
.pbig svg{width:30px;height:30px}
.skipbtn{position:relative;width:52px;height:52px;border:0;background:none;color:#F7F2E8;display:grid;place-items:center}
.skipbtn svg{width:34px;height:34px}
.skipbtn b{position:absolute;font-size:.62rem;font-weight:700;top:52%;left:50%;transform:translate(-50%,-50%)}
.popts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.popts button{border:0;background:none;color:#F7F2E8;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:6px 0;min-height:52px;opacity:.9}
.popts button svg{width:24px;height:24px}
.popts button b{font-size:1.05rem;line-height:24px}
.popts button[aria-pressed="true"]{color:#F4C98A;opacity:1}

/* sheet / modal */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(30,26,20,.42);display:flex;align-items:flex-end;justify-content:center;animation:fadein2 .25s both}
@keyframes fadein2{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:520px;max-height:86vh;overflow:auto;background:var(--cream);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:#D8CEBF;margin:0 auto 12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:0 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--ivory);font-weight:600;text-align:left}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--sage);background:var(--sage-soft)}
.opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid #BDB3A3;flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .radio,.opt[aria-checked="true"] .radio{border-color:var(--sage)}
.opt[aria-pressed="true"] .radio::after,.opt[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--sage)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:#2D3830;color:#FBF6EE;padding:12px 20px;border-radius:999px;font-size:.9rem;font-weight:500;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:toastin .3s both;max-width:90vw;text-align:center}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* journal */
.datebar{display:flex;align-items:center;justify-content:space-between;background:var(--ivory);border-radius:18px;box-shadow:var(--shadow);padding:6px}
.datebar b{font-weight:600}
.write{width:100%;min-height:170px;resize:vertical;border:1.5px solid var(--line);border-radius:18px;background:var(--ivory);padding:16px;font-size:1rem;line-height:1.55;outline:none}
.write:focus{border-color:var(--sage)}
.prompt{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:10px 14px;border:0;border-radius:16px;background:var(--ivory);box-shadow:0 6px 16px -14px rgba(70,55,35,.5);text-align:left;font-weight:500}
.prompt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--sage)}
.prompt .pi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.prompt .pi svg{width:18px;height:18px}
.entry{display:flex;flex-direction:column;gap:6px}
.entry .txt{white-space:pre-wrap;overflow-wrap:anywhere}

/* progress */
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 button{min-height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--ivory);font-weight:600;font-size:.9rem}
.seg3 button[aria-pressed="true"]{background:var(--sage-soft);border-color:var(--sage);color:var(--botanical)}
.phero{display:flex;align-items:center;gap:18px;padding:18px;border-radius:var(--r-lg);background:linear-gradient(135deg,#E3EEDF,#D5E6D2);box-shadow:var(--shadow)}
.phero img{width:84px;height:84px;flex:none}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--ivory);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 6px}
.stats3 div{text-align:center;padding:0 4px;border-right:1px solid var(--line)}
.stats3 div:last-child{border-right:0}
.stats3 b{display:block;font-family:var(--serif);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stats3 span{font-size:.74rem;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{width:36px;height:36px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--beige);color:transparent}
.week .d.on{background:var(--sage);color:#fff}
.week .d.today{box-shadow:0 0 0 2px var(--sage)}
.week .d svg{width:16px;height:16px}
.week span{display:block;margin-top:6px;font-size:.78rem;font-weight:600;color:var(--muted)}

/* burning bowl */
